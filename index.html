<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png">
    <link rel="apple-touch-icon" href="/favicon-256x256.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- DNS 预解析和预连接优化 -->
    <!-- 预连接到第三方域名，减少 DNS + TCP + SSL 握手时间 -->
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://pagead2.googlesyndication.com">
    <link rel="preconnect" href="https://www.google-analytics.com">

    <!-- DNS 预解析（优先级较低的域名）-->
    <link rel="dns-prefetch" href="https://googleads.g.doubleclick.net">
    <link rel="dns-prefetch" href="https://adservice.google.com">

    <title>UFreeTools - Your Best Free Tools</title>
    <script>
      // 提供基本的 Node.js 全局对象
      window.process = window.process || { env: {} };
      window.global = window;
    </script>
    <!-- AdSense 初始化脚本 -->
     <!-- Bing Webmaster Tools 验证标签 -->
     <meta name="msvalidate.01" content="621E8D02B0A071DF012F88DD60B3070C" />
    <!-- Yandex Webmaster Tools 验证标签 -->
    <meta name="yandex-verification" content="ee1007c2ba1af992" />
    <!-- Baidu Webmaster Tools 验证标签 -->
    <meta name="baidu-site-verification" content="codeva-atZuhJtxnx" />
    <!-- Naver Webmaster Tools 验证标签 -->
    <meta name="naver-site-verification" content="6893f8d106b6dc257cc9d32a99c22bae48ee6b08" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.adsbygoogle = window.adsbygoogle || [];

      const loadDeferredScript = (src, attrs = {}) => {
        const script = document.createElement('script');
        script.async = true;
        script.src = src;
        for (const [key, value] of Object.entries(attrs)) {
          script.setAttribute(key, value);
        }
        document.head.appendChild(script);
      };

      const loadNonCriticalThirdParty = () => {
        loadDeferredScript('https://www.googletagmanager.com/gtag/js?id=G-Z89MJFRKWW');
        gtag('js', new Date());
        gtag('config', 'G-Z89MJFRKWW');

        loadDeferredScript('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8218613358195023', {
          crossorigin: 'anonymous'
        });
      };

      window.addEventListener('load', () => {
        const scheduleIdle = window.requestIdleCallback || ((callback) => setTimeout(callback, 1500));
        scheduleIdle(loadNonCriticalThirdParty, { timeout: 3000 });
      }, { once: true });
    </script>
  </body>
</html>
